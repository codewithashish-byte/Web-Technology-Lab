<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
.wrap{max-width:850px;margin:40px auto;padding:20px}.hero{background:linear-gradient(135deg,#4338ca,#2563eb);color:white;padding:28px;border-radius:18px}
.hero h1{margin:0 0 8px}.panel{background:white;padding:22px;margin-top:18px;border-radius:16px;box-shadow:0 8px 25px #15264a12}
.form{display:flex;gap:10px}.form input{flex:1;min-width:0;padding:12px;border:1px solid #ccd5e2;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:bold;background:#4338ca;color:white}
.stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.stat{flex:1;min-width:110px;background:#eef2ff;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:5px}
li{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf0f5}ul{padding:0;margin:0}.task-text{flex:1}.done .task-text{text-decoration:line-through;color:#8993a4}.delete{background:#fee2e2;color:#b91c1c}
.small{color:#64748b;font-size:14px}.secondary{background:#e0e7ff;color:#3730a3}
@media(max-width:560px){.form{flex-direction:column}.hero{padding:22px}}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>Student Task Manager</h1><p>Keep track of assignments, study goals and daily tasks.</p></section>
<section class="panel"><form class="form" id="taskForm"><input id="taskInput" placeholder="Enter a task, e.g. Revise JavaScript" required><button>Add Task</button></form>
<div class="stats"><div class="stat">Total Tasks<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Completed<b id="completed">0</b></div></div></section>
<section class="panel"><h2>Your Tasks</h2><p class="small" id="message">Add a task to get started.</p><ul id="taskList"></ul></section>
<section class="panel"><h2>Sample Tasks from API</h2><button id="loadSample" class="secondary">Load Sample Tasks</button><p class="small" id="apiMessage">Loads sample tasks from JSONPlaceholder.</p><ul id="apiList"></ul></section>
</main>
<script>
let tasks = [];
let nextId = 1;
const taskInput = document.getElementById("taskInput");
function renderTasks(){
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.map(task => {
    const li = document.createElement("li");
    if(task.completed) li.classList.add("done");
    const check = document.createElement("input"); check.type = "checkbox"; check.checked = task.completed;
    check.addEventListener("change", () => { task.completed = check.checked; renderTasks(); });
    const span = document.createElement("span"); span.className = "task-text"; span.textContent = task.title;
    const del = document.createElement("button"); del.className = "delete"; del.textContent = "Delete";
    del.addEventListener("click", () => { tasks = tasks.filter(item => item.id !== task.id); renderTasks(); });
    li.append(check, span, del); list.appendChild(li);
  });
  document.getElementById("total").textContent = tasks.length;
  document.getElementById("completed").textContent = tasks.reduce((sum, task) => sum + (task.completed ? 1 : 0), 0);
  document.getElementById("pending").textContent = tasks.filter(task => !task.completed).length;
  document.getElementById("message").textContent = tasks.length ? "Tick a task when finished, or delete it." : "Add a task to get started.";
}
document.getElementById("taskForm").addEventListener("submit", e => {
  e.preventDefault(); tasks.push({id: nextId++, title: taskInput.value.trim(), completed:false});
  taskInput.value = ""; renderTasks();
});
document.getElementById("loadSample").addEventListener("click", async () => {
  const msg = document.getElementById("apiMessage"); msg.textContent = "Loading...";
  try {
    const response = await fetch("https://jsonplaceholder.typicode.com/todos?_limit=4");
    if(!response.ok) throw new Error("Request failed");
    const data = await response.json(); const list = document.getElementById("apiList"); list.innerHTML = "";
    data.map(item => { const li = document.createElement("li"); li.textContent = item.title; list.appendChild(li); });
    msg.textContent = "Sample tasks loaded successfully.";
  } catch(error) { msg.textContent = "Could not load sample tasks. Check your internet connection."; }
});
renderTasks();
</script></body></html>
