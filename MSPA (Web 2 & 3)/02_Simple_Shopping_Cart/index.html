<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Shopping Cart</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182230;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:35px auto;padding:20px}
header{padding:28px;border-radius:18px;background:linear-gradient(135deg,#047857,#0f766e);color:white}header h1{margin:0 0 8px}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.panel{background:white;padding:20px;border-radius:15px;box-shadow:0 8px 25px #10203010}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.product{border:1px solid #e2e8f0;border-radius:12px;padding:16px;overflow:hidden}.product-image{width:100%;height:155px;object-fit:contain;display:block;background:#f8fafc;border-radius:9px;margin-bottom:12px}.product h3{margin:4px 0 10px}.price{font-size:20px;font-weight:bold;margin:12px 0;color:#047857}
button{background:#047857;color:white;border:0;border-radius:8px;padding:10px 12px;font-weight:bold;cursor:pointer}.remove{background:#fee2e2;color:#b91c1c}.cartrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f5}.muted{color:#64748b;font-size:14px}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header><h1>Simple Shopping Cart</h1><p>Browse products, add items, and see your total instantly.</p></header>
<div class="layout"><section class="panel"><h2>Products</h2><p id="apiStatus" class="muted">Loading products from Fake Store API…</p><div id="products" class="products"></div></section>
<section class="panel"><h2>Your Cart (<span id="cartCount">0</span>)</h2><div id="cart"></div><h3>Total: ₹<span id="total">0.00</span></h3><button id="clearCart" class="remove">Clear Cart</button></section></div>
</main><script>
const fallbackProducts = [
 {id:1,title:"Wireless Headphones",price:1499},
 {id:2,title:"Smart Watch",price:2199},
 {id:3,title:"Backpack",price:899},
 {id:4,title:"Water Bottle",price:399}
];
let products = fallbackProducts;
let cart = [];
function makeFallbackImage(label,type){
 const short=String(label||type).replace(/[<>&]/g,"").slice(0,26);
 const isMovie=type==="movie";
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" rx="18" fill="${isMovie?"#312e81":"#e2e8f0"}"/><circle cx="200" cy="112" r="58" fill="${isMovie?"#7c3aed":"#cbd5e1"}"/><rect x="164" y="76" width="72" height="72" rx="12" fill="${isMovie?"#ddd6fe":"#64748b"}"/><path d="M180 95h40M180 110h40M180 125h28" stroke="${isMovie?"#4c1d95":"#f8fafc"}" stroke-width="7" stroke-linecap="round"/><text x="200" y="225" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="${isMovie?"#ffffff":"#334155"}">${short}</text><text x="200" y="258" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="${isMovie?"#ddd6fe":"#64748b"}">${isMovie?"SHOW POSTER":"PRODUCT IMAGE"}</text></svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function renderProducts(){
 const area=document.getElementById("products"); area.innerHTML="";
 products.slice(0,8).map(p=>{
  const card=document.createElement("div");card.className="product";
  const image=document.createElement("img");image.className="product-image";image.alt=p.title;
  image.src=p.image || makeFallbackImage(p.title,"product");
  image.onerror=()=>{image.onerror=null;image.src=makeFallbackImage(p.title,"product");};
  const name=document.createElement("h3");name.textContent=p.title;
  const price=document.createElement("div");price.className="price";price.textContent="₹"+Number(p.price).toFixed(2);
  const btn=document.createElement("button");btn.textContent="Add to Cart";btn.onclick=()=>addToCart(p);
  card.append(image,name,price,btn);area.appendChild(card);
 });
}
function addToCart(product){
 const existing=cart.find(item=>item.id===product.id);
 if(existing) existing.quantity++; else cart.push({...product,quantity:1});
 renderCart();
}
function renderCart(){
 const area=document.getElementById("cart");area.innerHTML="";
 cart.map(item=>{
  const row=document.createElement("div");row.className="cartrow";
  const info=document.createElement("span");info.textContent=item.title+" × "+item.quantity;
  const remove=document.createElement("button");remove.className="remove";remove.textContent="Remove";
  remove.onclick=()=>{cart=cart.filter(p=>p.id!==item.id);renderCart();};
  row.append(info,remove);area.appendChild(row);
 });
 document.getElementById("cartCount").textContent=cart.reduce((sum,item)=>sum+item.quantity,0);
 document.getElementById("total").textContent=cart.reduce((sum,item)=>sum+item.price*item.quantity,0).toFixed(2);
 if(!cart.length) area.innerHTML='<p class="muted">Your cart is empty. Add a product to begin.</p>';
}
document.getElementById("clearCart").onclick=()=>{cart=[];renderCart();};
async function loadProducts(){
 try{
  const response=await fetch("https://fakestoreapi.com/products");
  if(!response.ok) throw new Error("API unavailable");
  products=await response.json();
  document.getElementById("apiStatus").textContent="Products loaded from Fake Store API.";
 }catch(e){document.getElementById("apiStatus").textContent="API unavailable; showing sample products instead.";}
 renderProducts();
}
loadProducts();renderCart();
</script></body></html>
